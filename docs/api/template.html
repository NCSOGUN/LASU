<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>HealthAccess API reference</title>
  <meta name="description" content="Endpoint reference and request runner for the HealthAccess online API." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%230b6b5f'/%3E%3Cpath%20d='M16%206%209%208.6v5.1c0%204.2%202.8%207.4%207%209.3%204.2-1.9%207-5.1%207-9.3V8.6L16%206Z'%20fill='none'%20stroke='white'%20stroke-width='1.8'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("healthaccess.apiDocs.theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved === "dark" || saved === "light" ? saved : (prefersDark ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
__HEALTHACCESS_STYLES__
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to endpoint content</a>

  <header class="topbar" id="top">
    <div class="topbar-inner">
      <a class="brand" href="#main" aria-label="HealthAccess API reference">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.4 5.4 5.9v5.3c0 4.2 2.8 7.5 6.6 9.4 3.8-1.9 6.6-5.2 6.6-9.4V5.9L12 3.4Z" />
            <path d="M8.2 12.1h2.1l1.2-2.7 1.6 5.2 1.1-2.5h1.8" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">HealthAccess <span>API</span></span>
          <span class="brand-sub">Reference and request runner</span>
        </span>
        <span class="version-badge" aria-label="API version 1">v1</span>
      </a>

      <div class="topbar-fields">
        <label class="env-field" for="baseUrl">
          <span class="field-caption">Base URL</span>
          <input
            id="baseUrl"
            class="env-input"
            type="url"
            inputmode="url"
            spellcheck="false"
            autocomplete="off"
            aria-describedby="baseUrlHint"
          />
        </label>
        <span class="sr-only" id="baseUrlHint">Base URL used for request examples and the try it panel.</span>

        <div class="search-field" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.2" />
            <path d="m15.2 15.2 4.1 4.1" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="Search endpoints"
            aria-label="Search endpoints by name, path, or summary"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="key-hint" aria-hidden="true">/</kbd>
          <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </div>

      <div class="topbar-actions">
        <button
          class="icon-button nav-toggle"
          id="navToggle"
          type="button"
          aria-expanded="false"
          aria-controls="sidebar"
          aria-label="Open endpoint list"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h10" />
          </svg>
        </button>
        <button
          class="icon-button theme-toggle"
          id="themeToggle"
          type="button"
          aria-pressed="false"
          aria-label="Switch to dark theme"
          title="Toggle color theme"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3.6" />
            <path d="M12 3.2v1.9M12 18.9v1.9M4.8 12H2.9M21.1 12h-1.9M6.9 6.9 5.6 5.6M18.4 18.4l-1.3-1.3M17.1 6.9l1.3-1.3M5.6 18.4l1.3-1.3" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="API endpoints">
      <div class="sidebar-heading">
        <span class="sidebar-label">Endpoints</span>
        <span class="sidebar-count" id="endpointCount" aria-live="polite">Loading</span>
        <button class="sidebar-close" id="navClose" type="button" aria-label="Close endpoint list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <nav class="endpoint-nav" id="endpointNav" aria-label="Endpoint list"></nav>
      <p class="sidebar-foot" id="sidebarFoot"></p>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

    <main class="main" id="main" tabindex="-1">
      <div id="statusBanner"></div>
      <div id="endpointRoot" aria-busy="true">
        <div class="loading-panel" role="status">
          <div class="skeleton skeleton-kicker"></div>
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line skeleton-line--short"></div>
          <div class="skeleton skeleton-block"></div>
          <span class="sr-only">Loading the API reference</span>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript-note">This reference needs JavaScript for search, deep links, and the request runner. Enable JavaScript to continue.</div>
  </noscript>

  <script>
window.__API_DOCS__ = __HEALTHACCESS_DATA__;
  </script>
  <script>
__HEALTHACCESS_APP__
  </script>
</body>
</html>
