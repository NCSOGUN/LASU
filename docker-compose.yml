# HealthAccess compose stack.
#
# Includes PostgreSQL 16 and Redis 7. S3/MinIO is not included: set its details
# in backend/online/.env if you use uploads. Africa's Talking, AI providers and
# FCM are external services configured in the backend env files.
#
# The backend containers get DATABASE_URL and REDIS_URL from this file, so the
# localhost values in backend/*/.env are only used when running the services
# directly with npm, not in Docker.
#
# First start:
#   docker compose up -d --build
#   docker compose run --rm online npm run db:seed   # optional demo fixtures
#
# Local URLs:
#   http://localhost:3000/v1       online API
#   http://localhost:3000/docs     API reference served by the API
#   http://localhost:8080          standalone API reference
#   http://localhost:3001          offline SMS/USSD callbacks
#
# Services:
#   postgres        PostgreSQL 16 with a persistent volume
#   redis           Redis 7 with AOF persistence
#   migrate         one-shot Prisma migration job, runs before online/offline
#   online          Express 5 API (port 3000)
#   offline         SMS/USSD HTTP callbacks (port 3001)
#   offline-worker  SMS outbox and conversation worker
#   docs            static API reference + same-origin /v1 proxy (port 8080)

name: healthaccess

x-backend: &backend
  image: healthaccess-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    TZ: "${TZ:-Africa/Lagos}"
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthaccess
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-healthaccess}"
      POSTGRES_DB: healthaccess
    volumes:
      - healthaccess_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthaccess -d healthaccess"]
      interval: 5s
      timeout: 5s
      retries: 20
    # ports:
    #   - "5432:5432"   # uncomment only if you need host access to this database

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - healthaccess_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    # ports:
    #   - "6379:6379"   # uncomment only if you need host access to Redis

  migrate:
    <<: *backend
    restart: "no"
    env_file:
      - path: backend/online/.env
        required: false
    environment:
      DATABASE_URL: "postgresql://healthaccess:${POSTGRES_PASSWORD:-healthaccess}@postgres:5432/healthaccess"
      TZ: "${TZ:-Africa/Lagos}"
    command:
      - ./node_modules/.bin/prisma
      - migrate
      - deploy
      - --schema
      - backend/online/prisma/schema.prisma
    depends_on:
      postgres:
        condition: service_healthy

  online:
    <<: *backend
    env_file:
      - path: backend/online/.env
        required: false
    command: ["node", "backend/online/dist/server.js"]
    environment:
      DATABASE_URL: "postgresql://healthaccess:${POSTGRES_PASSWORD:-healthaccess}@postgres:5432/healthaccess"
      REDIS_URL: "redis://redis:6379"
      PORT: "3000"
      TZ: "${TZ:-Africa/Lagos}"
    ports:
      - "${ONLINE_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  offline:
    <<: *backend
    env_file:
      - path: backend/offline/.env
        required: false
    command: ["node", "backend/offline/dist/server.js"]
    environment:
      DATABASE_URL: "postgresql://healthaccess:${POSTGRES_PASSWORD:-healthaccess}@postgres:5432/healthaccess"
      PORT: "3001"
      HOST: "0.0.0.0"
      TZ: "${TZ:-Africa/Lagos}"
    ports:
      - "${OFFLINE_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  offline-worker:
    <<: *backend
    env_file:
      - path: backend/offline/.env
        required: false
    command: ["node", "backend/offline/dist/worker.js"]
    environment:
      DATABASE_URL: "postgresql://healthaccess:${POSTGRES_PASSWORD:-healthaccess}@postgres:5432/healthaccess"
      TZ: "${TZ:-Africa/Lagos}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  docs:
    image: healthaccess-docs:local
    build:
      context: .
      dockerfile: docker/docs/Dockerfile
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8080}:80"
    depends_on:
      online:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  healthaccess_pgdata:
  healthaccess_redisdata:
